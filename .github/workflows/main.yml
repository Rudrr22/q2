name: Matrix Build CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: matrix-8d4b8c3
      id: matrix-8d4b8c3
      run: echo "Building for Node.js version ${{ matrix.node-version }}"

    - name: Generate build artifact
      run: echo "Build output for Node.js version ${{ matrix.node-version }}" > output.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-8d4b8c3-node${{ matrix.node-version }}
        path: output.txt
